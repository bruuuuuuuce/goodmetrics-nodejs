name: Release & Publish

on:
  push:
    branches:
      - main

# Release Please needs these permissions to create/update its release PR
# and create the GitHub release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  publish:
    name: Publish to npm

    needs: release

    # Only publish when merging the Release Please PR actually
    # resulted in a new GitHub release.
    if: ${{ needs.release.outputs.release_created == 'true' }}

    runs-on: ubuntu-latest

    # This must match the environment configured for the
    # Trusted Publisher on npm.
    environment: npm

    # OIDC requires id-token: write.
    # We don't need write access to the repository here.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
