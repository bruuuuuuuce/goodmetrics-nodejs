# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Build Node.js Package

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install and Build
        run: |
          npm ci
          npm run build
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run integration
      - name: Cache LocalStack image
        id: cache-localstack-image
        uses: actions/cache@v6
        with:
          path: /tmp/docker-cache/localstack.tar
          key: docker-localstack-${{ hashFiles('test/lambda-e2e/docker-compose.yml') }}
      - name: Load cached LocalStack image
        if: steps.cache-localstack-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/localstack.tar
      - name: Pull and cache LocalStack image
        if: steps.cache-localstack-image.outputs.cache-hit != 'true'
        run: |
          docker pull localstack/localstack:4
          mkdir -p /tmp/docker-cache
          docker save localstack/localstack:4 -o /tmp/docker-cache/localstack.tar
      - name: Lambda e2e test (LocalStack)
        run: bash test/lambda-e2e/run.sh
